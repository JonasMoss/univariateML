name: site
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      EMCC_CORES: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install site data dependencies
        run: python -m pip install PyYAML==6.0.3 sympy==1.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::BH
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: '6.0.13'
          actions-cache-folder: emsdk-cache
      - uses: extractions/setup-just@v3
      - uses: actions/cache@v4
        id: node
        with:
          path: site/node_modules
          key: node-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('site/package-lock.json') }}
      - name: Install locked site dependencies
        if: steps.node.outputs.cache-hit != 'true'
        run: npm ci --prefix site
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('site/package-lock.json') }}
      - name: Prepare browser and standalone snippet headers
        run: |
          node site/node_modules/playwright-core/cli.js install --with-deps chromium --only-shell
          echo "BOOST_INCLUDE_DIR=$(Rscript -e 'cat(system.file("include", package="BH"))')" >> "$GITHUB_ENV"
      - name: Build and test WebAssembly and site
        run: |
          just js-build
          just js-test
          just site-check
